name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Inspect Minecraft API (debug)
        if: always()
        run: |
          J=$(find ~/.gradle ~/.cache -name '*.jar' -path '*minecraft*' 2>/dev/null | grep -iE 'minecraft-(merged|client|common)' | grep -v sources | head -3)
          echo "JARS: $J"
          for j in $J; do
            for c in net.minecraft.client.color.block.BlockColors net.minecraft.client.color.block.BlockTintSource net.minecraft.client.renderer.block.BlockModelShaper; do javap -public -cp $j $c 2>&1 | head -40; done
            break
          done
          F=$(find ~/.gradle -name 'fabric-key-mapping-api-v1*.jar' | head -1); echo "KEYJAR $F"; unzip -l $F | grep -i keymapping | head
          for c in net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper; do javap -public -cp $F $c 2>&1 | head; done

      - uses: actions/upload-artifact@v4
        with:
          name: bmcatlas-jar
          path: build/libs/*.jar

      - name: Definir tag do release
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
            echo "name=v${ver}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          files: build/libs/*.jar
          generate_release_notes: true
