name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Inspecionar API (temporário)
        if: always()
        run: |
          J=$(find ./.gradle/loom-cache -name 'minecraft-merged-*.jar' | grep -v sources | head -1)
          FR=$(find ./.gradle/loom-cache/remapped_mods -name 'fabric-rendering-v1-*.jar' | head -1)
          for c in 'net.minecraft.client.gui.render.pip.GuiBookModelRenderer'; do echo "=== CODE $c"; javap -p -c -cp "$J" "$c" | grep -E "invoke|getstatic|ldc|public|protected" | head -80; done
          for c in net.minecraft.client.gui.GuiGraphics net.minecraft.client.gui.render.state.GuiRenderState 'net.minecraft.client.renderer.MultiBufferSource$BufferSource' net.minecraft.client.renderer.RenderType net.minecraft.client.renderer.block.model.BlockStateModel net.minecraft.client.renderer.block.model.BlockModelPart net.minecraft.client.renderer.block.model.BakedQuad net.minecraft.client.renderer.texture.TextureAtlasSprite com.mojang.blaze3d.vertex.VertexConsumer net.minecraft.client.renderer.CachedOrthoProjectionMatrixBuffer net.minecraft.client.renderer.block.BlockModelShaper; do
            echo "=== $c"
            javap -p -cp "$J" "$c" 2>&1 | grep -v -E "lambda\$|synthetic" | head -120
          done
          for c in 'net.fabricmc.fabric.api.client.rendering.v1.SpecialGuiElementRegistry' 'net.fabricmc.fabric.api.client.rendering.v1.SpecialGuiElementRegistry$Context' 'net.fabricmc.fabric.api.client.rendering.v1.SpecialGuiElementRegistry$Factory'; do echo "=== $c"; javap -p -cp "$FR:$J" "$c"; done
      - uses: actions/upload-artifact@v4
        with:
          name: hoi4map-jar
          path: build/libs/*.jar

      - name: Definir tag do release
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
            echo "name=v${ver}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          files: build/libs/*.jar
          generate_release_notes: true
