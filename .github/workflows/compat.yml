name: compat

on:
  push:
    branches: [mc-26.1]
    paths: ['.github/workflows/compat.yml']

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: 26.1.2
            api: 0.155.2+26.1.2
          - mc: 26.2
            api: 0.161.0+26.2
          - mc: 26.3
            api: 0.166.0+26.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Compile against ${{ matrix.mc }}
        run: gradle compileJava --no-daemon -Pminecraft_version=${{ matrix.mc }} -Pfabric_version=${{ matrix.api }}
      - name: Inspect APIs
        if: always()
        run: |
          j=$(ls ~/.gradle/caches/fabric-loom/${{ matrix.mc }}/minecraft-merged.jar)
          for c in net.minecraft.client.gui.Hud net.minecraft.client.gui.Gui net.minecraft.client.Options net.minecraft.client.Minecraft; do echo "## $c"; javap -cp $j -public $c | grep -iE "hide|hidden|visible|showHud|toggleGui"; done
          echo "## SDL"; find ~/.gradle -iname '*lwjgl*sdl*' | head -3
          javap -cp $j -public net.minecraft.client.Minecraft | grep -E " screen|Screen\(\)"
