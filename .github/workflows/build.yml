name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Inspecionar API (temporário)
        if: always()
        run: |
          J=$(find ./.gradle/loom-cache -name 'minecraft-merged-*.jar' | grep -v sources | head -1)
          F=$(find ~/.gradle ./.gradle -name 'fabric-rendering-v1*.jar' -o -name 'fabric-api-*.jar' 2>/dev/null | grep -v sources | head -20)
          echo "FABRIC: $F"
          for c in net.minecraft.client.gui.render.pip.PictureInPictureRenderer net.minecraft.client.gui.render.state.pip.PictureInPictureRenderState net.minecraft.client.gui.render.pip.GuiBookModelRenderer net.minecraft.client.gui.render.state.pip.GuiBookModelRenderState com.mojang.blaze3d.systems.RenderPass com.mojang.blaze3d.systems.CommandEncoder com.mojang.blaze3d.systems.GpuDevice com.mojang.blaze3d.vertex.MeshData com.mojang.blaze3d.vertex.BufferBuilder com.mojang.blaze3d.vertex.VertexFormat com.mojang.blaze3d.pipeline.RenderPipeline\$Builder net.minecraft.client.renderer.RenderPipelines com.mojang.blaze3d.pipeline.RenderTarget com.mojang.blaze3d.buffers.GpuBuffer; do
            echo "=== $c"
            javap -p -cp "$J" "$c" | head -90
          done
          for f in $F; do echo "--- $f"; unzip -l "$f" | grep -i -E "SpecialGuiElement|PictureInPicture" | awk '{print $4}'; done
      - uses: actions/upload-artifact@v4
        with:
          name: hoi4map-jar
          path: build/libs/*.jar

      - name: Definir tag do release
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
            echo "name=v${ver}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          files: build/libs/*.jar
          generate_release_notes: true
