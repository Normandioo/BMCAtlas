name: build

# One source tree, two jars: Minecraft 1.21.11 as written, and Minecraft 26.x generated by tools/port26.py.
# A push to main publishes one release with both jars; other branches only build.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "1.21.11"
            java: 21
            gradle: "9.2.0"
          - target: "26.x"
            java: 25
            gradle: current
    steps:
      - uses: actions/checkout@v4
      - name: Port to Minecraft 26.x
        if: matrix.target == '26.x'
        run: python3 tools/port26.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Name the jar
        run: |
          mkdir out
          ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          cp "build/libs/bmcatlas-${ver}.jar" "out/bmcatlas-${ver//+/-}.jar"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: out/*.jar

  # the 26.x jar is one file for every 26.x release: the same source must compile against each of them
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.2"
            api: 0.161.0+26.2
          - mc: "26.3"
            api: 0.166.0+26.3
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/port26.py ${{ matrix.mc }} ${{ matrix.api }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Compile against ${{ matrix.mc }}
        run: gradle compileJava --no-daemon

  release:
    needs: [build, compat]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Tag
        id: tag
        run: |
          ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "name=v${ver}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: BMC Atlas ${{ steps.tag.outputs.ver }} (build ${{ github.run_number }})
          files: jars/*.jar
          make_latest: true
          body: |
            - `bmcatlas-${{ steps.tag.outputs.ver }}.jar`: Minecraft 1.21.11
            - `bmcatlas-${{ steps.tag.outputs.ver }}-mc26.x.jar`: Minecraft 26.1, 26.2 and 26.3

            Requires Fabric Loader and Fabric API. Client-side only. Changes: see CHANGELOG.md.
