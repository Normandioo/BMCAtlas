name: compat

on:
  push:
    branches: [mc-26.1]
    paths: ['.github/workflows/compat.yml']

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: 26.1.2
            api: 0.155.2+26.1.2
          - mc: 26.2
            api: 0.161.0+26.2
          - mc: 26.3
            api: 0.166.0+26.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Compile against ${{ matrix.mc }}
        run: gradle compileJava --no-daemon -Pminecraft_version=${{ matrix.mc }} -Pfabric_version=${{ matrix.api }}
      - name: Inspect APIs
        if: always()
        run: |
          j=$(ls ~/.gradle/caches/fabric-loom/${{ matrix.mc }}/minecraft-merged.jar)
          javap -cp $j -public net.minecraft.client.gui.Hud | grep -iE "overlay|message|actionbar"
          echo ---OPTS; javap -cp $j -public net.minecraft.client.Options | grep -iE "hide|gui"
          echo ---MC; javap -cp $j -public net.minecraft.client.Minecraft | grep -E "getWindow|window|mouseHandler|setScreen|getInstance"
          echo ---MOUSE; javap -cp $j -public net.minecraft.client.MouseHandler | grep -iE "press|left|xpos|ypos|handle|button"
          echo ---WIN; javap -cp $j -public com.mojang.blaze3d.platform.Window | grep -iE "handle|window\(|getWindow"
          echo ---LWJGL; unzip -l $j | grep -iE "org/lwjgl" | head -3; find ~/.gradle -name '*.jar' | grep -iE "lwjgl-(glfw|sdl)|lwjgl-3" | head; find ~/.gradle -name 'lwjgl*' | head -5
