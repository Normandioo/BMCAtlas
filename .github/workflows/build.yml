name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Inspecionar API (temporário)
        if: always()
        run: |
          J=$(find ./.gradle/loom-cache -name 'minecraft-merged-*.jar' | grep -v sources | head -1)
          for c in net.minecraft.client.renderer.rendertype.RenderTypes 'net.minecraft.client.renderer.rendertype.RenderType' net.minecraft.client.renderer.rendertype.RenderSetup; do
            echo "=== $c"
            javap -p -cp "$J" "$c" 2>&1 | grep -v -E "lambda\$|synthetic" | head -140
          done
          echo "=== VertexConsumer defaults"; javap -p -cp "$J" com.mojang.blaze3d.vertex.VertexConsumer | grep default
          echo "=== PiP code"; javap -p -c -cp "$J" net.minecraft.client.gui.render.pip.PictureInPictureRenderer | grep -E "invoke|public|protected|private" | head -80
          echo "=== Lighting"; javap -p -cp "$J" com.mojang.blaze3d.platform.Lighting
      - uses: actions/upload-artifact@v4
        with:
          name: hoi4map-jar
          path: build/libs/*.jar

      - name: Definir tag do release
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
            echo "name=v${ver}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          files: build/libs/*.jar
          generate_release_notes: true
