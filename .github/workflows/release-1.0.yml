name: release-1.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-1.0.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Collect jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cd out
          gh release download v1.0.0-build.125 --repo ${{ github.repository }} -p '*.jar'
          gh release download v1.0.0-mc26.x-build.126 --repo ${{ github.repository }} -p '*.jar'
          mv 'bmcatlas-1.0.0+mc26.x.jar' bmcatlas-1.0.0-mc26.x.jar
          ls -l
      - name: Publish v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          target_commitish: main
          name: BMC Atlas 1.0
          make_latest: true
          files: out/*.jar
          body: |
            First stable release.

            **Downloads**
            - `bmcatlas-1.0.0.jar` — Minecraft 1.21.11
            - `bmcatlas-1.0.0-mc26.x.jar` — Minecraft 26.1, 26.2 and 26.3

            Requires Fabric Loader and Fabric API. Client-side only.
